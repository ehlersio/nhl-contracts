[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nhl-contracts"
version = "0.1.0"
description = "Open, provenance-first dataset of NHL player contracts built from official public sources (NHL.com club releases and staff stories, ESPN's transaction wire)."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Matt Ehlers" }]
keywords = ["nhl", "hockey", "contracts", "salary-cap", "open-data"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: MIT License",
  "Topic :: Database",
]
dependencies = [
  "httpx>=0.27",
  "pyarrow>=16",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
nhl-contracts = "nhl_contracts.run:main"

[tool.setuptools.packages.find]
include = ["nhl_contracts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
