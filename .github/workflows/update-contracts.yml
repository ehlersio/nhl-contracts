# Collector + publisher, modelled on nflverse-data.
#
# Scheduling: the primary trigger is `workflow_dispatch`, called by the EyeWall
# Cloudflare Worker hourly in season and every 15 minutes from July 1 to 15
# (GitHub's own cron runs hours late). The daily cron below is only a safety net.
#
# What a run does:
#   1. rebuilds the working store from data/raw/*.jsonl (committed: every story,
#      ESPN row and Bluesky post ever collected, since Forge's 25-item lists
#      cannot be re-read) and from wayback_pages.sqlite on the `contracts`
#      release (the one-off CapFriendly archive crawl),
#   2. polls NHL.com Forge, ESPN and Bluesky, normalizes, writes dist/,
#   3. commits the refreshed JSONL back to the repository,
#   4. uploads dist/* to the `contracts` release tag, overwriting the previous
#      assets (nflverse style: one moving tag).
name: update-contracts

on:
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * *"   # daily safety net (UTC); the Worker dispatch is the real schedule

permissions:
  contents: write

concurrency:
  group: update-contracts
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: contracts
      GH_TOKEN: ${{ github.token }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}   # enables the LLM fallback when set
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e .

      - name: Fetch the archived CapFriendly pages from the release
        run: |
          mkdir -p data
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release download "$RELEASE_TAG" --pattern wayback_pages.sqlite --dir data || true
          fi

      - name: Collect, normalize, export (loads data/raw/*.jsonl first, dumps it after)
        run: python -m nhl_contracts.run all --espn-days 45 --refresh-players

      - name: Commit the refreshed raw JSONL
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw
          if ! git diff --cached --quiet; then
            git commit -m "data: raw rows $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi

      - name: Ensure the release exists
        run: |
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 || \
            gh release create "$RELEASE_TAG" --title "contracts (rolling)" \
              --notes "Rolling dataset release. Files are replaced on every run; see timestamp.json." --latest=false

      - name: Upload dataset
        run: |
          gh release upload "$RELEASE_TAG" dist/* --clobber
          # The archive file is uploaded once by hand (or after a wayback backfill):
          #   gh release upload contracts data/wayback_pages.sqlite --clobber

      - name: Summary
        run: |
          echo '### nhl-contracts' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat dist/timestamp.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
